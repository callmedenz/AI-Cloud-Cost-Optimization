services:
  - type: web
    name: cloud-cost-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /status
    envVars:
      - key: USE_SIMULATION
        value: "true"
      - key: UPDATE_INTERVAL_SECONDS
        value: "300"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AI_MAX_REQUESTS_PER_DAY
        value: "20"
      - key: AI_MAX_QUESTION_CHARS
        value: "500"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "300"
