AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only role for Cloud Cost Copilot

Parameters:
  PlatformAccountId:
    Type: String
    Description: AWS account ID that hosts the Cloud Cost Copilot service
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Unique external ID generated by the platform

Resources:
  CloudCostCopilotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudCostCopilotReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${PlatformAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CloudCostCopilotReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - cloudwatch:GetMetricStatistics
                  - ce:GetCostAndUsage
                Resource: "*"

Outputs:
  RoleArn:
    Description: Role ARN to enter in Cloud Cost Copilot
    Value: !GetAtt CloudCostCopilotRole.Arn
